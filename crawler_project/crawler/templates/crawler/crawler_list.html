<!DOCTYPE html>
<html>
<head>
    <title>爬虫列表</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 960px;
            margin: 2em auto;
            padding: 2em;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #343a40;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1.5em;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #e9ecef;
        }
        tbody tr:hover {
            background-color: #f1f3f5;
        }
        .form-container {
            margin-top: 2em;
            padding: 1.5em;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .form-container h2 {
            margin-top: 0;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 0.5em;
        }
        .form-group {
            margin-bottom: 1em;
        }
        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        nav {
            margin-bottom: 2em;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1em;
        }
        nav a {
            text-decoration: none;
            padding: 10px 15px;
            background: #e9ecef;
            color: #007bff;
            border-radius: 4px;
            margin-right: 10px;
        }
        nav a:hover {
            background: #d4d9df;
        }
        nav a.active {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>爬虫管理系统</h1>
        <nav>
            <a href="{% url 'crawler_list' %}" class="active">爬虫列表</a>
            <a href="{% url 'job_list' %}">工作列表</a>
        </nav>

        <h2>可用的爬虫</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名称</th>
                    <th>描述</th>
                </tr>
            </thead>
            <tbody>
                {% for crawler in crawlers %}
                <tr>
                    <td>{{ crawler.id }}</td>
                    <td>{{ crawler.name }}</td>
                    <td>{{ crawler.description }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">没有可用的爬虫。</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="form-container">
            <h2>启动一个新的爬取工作</h2>
            <form action="{% url 'start_crawl' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="crawler_id">选择一个爬虫:</label>
                    <select name="crawler_id" id="crawler_id" required>
                        {% for crawler in crawlers %}
                        <option value="{{ crawler.id }}">{{ crawler.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="url">要爬取的URL:</label>
                    <input type="url" name="url" id="url" required placeholder="http://example.com">
                </div>
                <button type="submit">启动爬虫</button>
            </form>
        </div>
    </div>
</body>
</html>
