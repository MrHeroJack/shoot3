<!DOCTYPE html>
<html>
<head>
    <title>工作列表</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 960px;
            margin: 2em auto;
            padding: 2em;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #343a40;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1.5em;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #e9ecef;
        }
        tbody tr:hover {
            background-color: #f1f3f5;
        }
        nav {
            margin-bottom: 2em;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1em;
        }
        nav a {
            text-decoration: none;
            padding: 10px 15px;
            background: #e9ecef;
            color: #007bff;
            border-radius: 4px;
            margin-right: 10px;
        }
        nav a:hover {
            background: #d4d9df;
        }
        nav a.active {
            background: #007bff;
            color: white;
        }
        .status-pending { color: #6c757d; font-weight: bold; }
        .status-running { color: #007bff; font-weight: bold; }
        .status-completed { color: #28a745; font-weight: bold; }
        .status-failed { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>爬虫管理系统</h1>
        <nav>
            <a href="{% url 'crawler_list' %}">爬虫列表</a>
            <a href="{% url 'job_list' %}" class="active">工作列表</a>
        </nav>

        <h2>爬取工作历史</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>爬虫</th>
                    <th>URL</th>
                    <th>状态</th>
                    <th>开始时间</th>
                    <th>结束时间</th>
                </tr>
            </thead>
            <tbody>
                {% for job in jobs %}
                <tr>
                    <td>{{ job.id }}</td>
                    <td>{{ job.crawler.name }}</td>
                    <td>{{ job.parameters.url }}</td>
                    <td class="status-{{ job.status }}">{{ job.get_status_display }}</td>
                    <td>{{ job.start_time|default:"N/A" }}</td>
                    <td>{{ job.end_time|default:"N/A" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="6">没有爬取工作。</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
